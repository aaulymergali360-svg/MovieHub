
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — MovieHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">MOVIE<span>HUB</span></a>
        <a href="register.html" class="register-btn">Регистрация</a>
    </header>

    <main class="auth-container">
        <form class="auth-form" id="loginForm">
            <h1>С возвращением!</h1>
            <p>Войди в свой аккаунт MovieHub</p>

            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email"
                   placeholder="Введите email" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   placeholder="Введите пароль" required>

            <button type="submit">Войти</button>

            <div id="message"></div>

            <p class="auth-switch">
                Нет аккаунта?
                <a href="register.html">Зарегистрироваться</a>
            </p>
        </form>
    </main>

    <script src="auth.js"></script>
</body>
</html>
