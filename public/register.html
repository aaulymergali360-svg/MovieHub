
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — MovieHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">MOVIE<span>HUB</span></a>
        <a href="login.html" class="login-btn">Войти</a>
    </header>

    <main class="auth-container">
        <form class="auth-form" id="registerForm">
            <h1>Создать аккаунт</h1>
            <p>Присоединяйся к миру MovieHub</p>

            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username"
                   placeholder="Введите имя" required>

            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email"
                   placeholder="Введите email" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   placeholder="Минимум 8 символов" minlength="8" required>

            <button type="submit">Зарегистрироваться</button>

            <div id="message"></div>

            <p class="auth-switch">
                Уже есть аккаунт?
                <a href="login.html">Войти</a>
            </p>
        </form>
    </main>

    <script src="auth.js"></script>
</body>
</html>
